# devices/duchamp/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py; the same words as
# hakios-mt6768's device.conf). Its SoC's layer is carried in soc/ (mt6897). Nothing below has been seen on the phone yet:
# `works` is written only after a run has shown it (docs/porting/index.md of the common repository).
device duchamp
	title	POCO X6 Pro 5G (duchamp)
	vendor	Xiaomi
	soc	mt6897
	defconfig	duchamp_defconfig
	firmware	pull-firmware.sh
	maintainer	Isaac (TheFormidable)
	status display partial boot not run yet: mtkloader carried over from the MT6768 (header v4, tools/chainboot.py); LK's framebuffer from chosen/atag,videolfb, 1220x2712 DSC video panel; never run
	status cpu partial 8 cores offered in order 0,7,6,5,4,1,2,3 (cpus=4: three Cortex-A715); never run
	status storage missing UFS (ufshci@112b0000), not eMMC: the MT6768's MSDC driver does not apply; the payload's RAM disk is the root
	status touch missing Goodix on SPI2 on this unit (dmesg GTP; the board also takes a FocalTech FT3683G), not the MT6768's TD4160
	status buttons missing volume up on the keypad (kp@1c00e000), power and volume down on the MT6363 PMIC over SPMI
	status gpu missing Mali-G615 MC6 (Valhall, CSF) behind GPUEB: the MT6768's Mali-G52 bring-up does not apply
	status sensors missing SCP sensor hub at 0x1c400000
	status wifi missing CONNAC3 gen4m (wlan_drv_gen4m_6897)
	status bluetooth missing bt_drv_6897
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
